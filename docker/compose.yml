# ElecKoi WebUI · 多用户形态
#
# 准备：
#   export ELECKOI_MASTER_KEY=$(openssl rand -base64 32)
#   docker compose -f docker/compose.yml up -d --build
#
# 首次访问 /login 注册第一个账号即可开始使用。
#
# 暴露范围：默认只绑宿主机回环。要开放给他人，先读 docs/webui/ 里的安全说明——
# 公网暴露前必须完成 M3（富内容卡片跨源隔离、CSP、签名媒体 URL、限流）。
#
# 可选：自带图床（Zipline），用于让角色卡里的图片有个稳定的家。
# 它在 `images` profile 下，不显式启用就不会启动；配置在 docker/.env 的「自带图床」段
#   docker compose -f docker/compose.yml --profile images up -d zipline-db zipline
# 数据落在宿主机目录（docker/.env 的 ZIPLINE_DATA_DIR），不是 Docker 命名卷。
# 详见 docs/webui/卡片外链图片本地化.md。

services:
  eleckoi-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${ELECKOI_IMAGE:-eleckoi-web:dev}
    container_name: eleckoi-web
    restart: unless-stopped
    ports:
      # ELECKOI_BIND：默认只绑回环（本机可用）。要给局域网访问，设为该网卡的 IP
      # （例如 ELECKOI_BIND=192.0.2.10），比 0.0.0.0 更收敛。
      - "${ELECKOI_BIND:-127.0.0.1}:${ELECKOI_PORT_HOST:-8790}:8790"
      # 卡片域必须与应用域不同源。用同一 IP 的另一个端口即可满足；
      # 访问地址要与 ELECKOI_CARD_ORIGIN 完全一致（协议+IP+端口）。
      - "${ELECKOI_BIND:-127.0.0.1}:${ELECKOI_CARD_PORT_HOST:-8791}:8790"
    environment:
      # 凭据加密主密钥（32 字节 base64）。必须自行生成并妥善保管：
      # 丢失后所有用户已保存的 API Key 都无法解密。
      ELECKOI_MASTER_KEY: "${ELECKOI_MASTER_KEY:?请先设置 ELECKOI_MASTER_KEY（openssl rand -base64 32）}"
      ELECKOI_PORT: "8790"
      ELECKOI_LOG_LEVEL: "info"
      # 自助注册：关闭后只能由管理员在「用户管理」里建号。
      # 账号池为空时仍然允许创建首个账号（自动成为管理员），否则服务将无人可管理。
      ELECKOI_ALLOW_REGISTRATION: "${ELECKOI_ALLOW_REGISTRATION:-0}"
      # 启动时按邮箱提升为管理员（逗号分隔）
      ELECKOI_ADMIN_EMAILS: "${ELECKOI_ADMIN_EMAILS:-}"
      # 无引用多久后回收该用户的运行时（释放 SQLite 句柄与 Agent 子进程）
      ELECKOI_TENANT_IDLE_MINUTES: "${ELECKOI_TENANT_IDLE_MINUTES:-30}"
      # 每用户同时进行的 Agent 回合上限（每个回合一个 node 子进程，是主要资源消耗）
      ELECKOI_MAX_CONCURRENT_RUNS: "${ELECKOI_MAX_CONCURRENT_RUNS:-2}"
      # 同时存活的租户上限，超过时淘汰最久未用的空闲租户
      ELECKOI_MAX_LIVE_TENANTS: "${ELECKOI_MAX_LIVE_TENANTS:-50}"
      # ── 富内容卡片跨源隔离（公网必配）──
      # 卡片域与应用域必须是两个不同的源。配了 ELECKOI_CARD_ORIGIN 就必须配
      # ELECKOI_APP_ORIGINS，否则服务启动即失败（卡片帧会拒绝一切文档投递）。
      # 未配置时卡片与宿主同源：角色卡能调用宿主全部 IPC，仅限本地自用。
      ELECKOI_CARD_ORIGIN: "${ELECKOI_CARD_ORIGIN:-}"
      ELECKOI_APP_ORIGINS: "${ELECKOI_APP_ORIGINS:-}"
      # ── 卡片图片：四种做法，改 ELECKOI_CARD_IMAGE_MODE 一个变量切换 ──
      #
      # 背景：卡片里的 <img src="https://某图床/x.png"> 默认会被卡片帧的 CSP 拦掉，
      # 现象是图片位置一块黑。四种做法各有取舍，按需选一种：
      #
      #   self-hosted（默认）导入时把图片传进你自己的图床。导出给别人也能取到图；
      #       代价是要自建图床。需要下面三个 IMAGE_* 变量 + 卡片源白名单填图床域。
      #
      #   local      导入时把图片存到宿主机目录，由本服务在卡片源上以 /card-images/ 提供。
      #       与卡片帧同源 → **不需要任何白名单**，也不用外部图床；
      #       代价：导出给别人后打不开（别人访问不到你的机器）。
      #       默认零配置：图片放在数据卷里的 /data/card-images。
      #
      #   inline     导入时把图片内联成 data: URI。不用图床、不用白名单，导出即自带图；
      #       代价是图片以 base64 写进卡片数据，只适合小图（默认只内联 256KB 以下）。
      #       不需要任何额外配置。
      #
      #   third-party 放行**任意 https 图床**、不搬运。最省事：不用给每张卡加白名单。
      #       ⚠️ 放开就等于承认卡片能把你的数据以图片请求发往任意域（GET，CSP 拦不住），
      #          只导入你信任的卡。可用 ELECKOI_CARD_IMAGE_BLOCKED_HOSTS 排除个别域
      #          （**尽力而为**：CSP 只能"允许某些源"，黑名单由卡片帧过滤，挡不住蓄意绕过）。
      #
      #   off        什么都不做（外链图保持黑块，与旧版本一致）。
      ELECKOI_CARD_IMAGE_MODE: "${ELECKOI_CARD_IMAGE_MODE:-self-hosted}"
      # self-hosted 用（third-party 已放开全部 https，不需要它）：
      # 额外允许卡片加载图片的源（逗号分隔的纯源）。
      # ⚠️ 只填**你自己控制**的域：放行哪个域就等于允许卡片把数据以图片请求发给它。
      ELECKOI_CARD_IMAGE_ORIGINS: "${ELECKOI_CARD_IMAGE_ORIGINS:-}"
      # third-party 用的黑名单（主机名或后缀，逗号分隔），如 postimg.cc,imgur.com
      ELECKOI_CARD_IMAGE_BLOCKED_HOSTS: "${ELECKOI_CARD_IMAGE_BLOCKED_HOSTS:-}"
      # third-party 是否连 http 图床也放行（默认否；开了更宽松）
      ELECKOI_CARD_IMAGE_ALLOW_HTTP: "${ELECKOI_CARD_IMAGE_ALLOW_HTTP:-0}"
      # self-hosted 用：图床对外地址、上传接口、API 令牌（三个都要，缺一自动关闭搬运）
      ELECKOI_IMAGE_PUBLIC_BASE: "${ELECKOI_IMAGE_PUBLIC_BASE:-}"
      ELECKOI_IMAGE_UPLOAD_API: "${ELECKOI_IMAGE_UPLOAD_API:-}"
      ELECKOI_IMAGE_UPLOAD_TOKEN: "${ELECKOI_IMAGE_UPLOAD_TOKEN:-}"
      # local 用：图片目录（容器内）。默认在数据卷里，零配置；要放别的大盘就自己加挂载
      ELECKOI_IMAGE_LOCAL_DIR: "${ELECKOI_IMAGE_LOCAL_DIR:-/data/card-images}"
      # 搬运时机：inline（默认，导入等图片搬完才返回，界面上有进度条）或 background
      ELECKOI_IMAGE_LOCALIZE_MODE: "${ELECKOI_IMAGE_LOCALIZE_MODE:-inline}"
      # 单次导入的搬运上限（张数 / 单图字节 / 总时间预算）与并发数
      ELECKOI_IMAGE_MAX_PER_IMPORT: "${ELECKOI_IMAGE_MAX_PER_IMPORT:-2000}"
      ELECKOI_IMAGE_MAX_BYTES: "${ELECKOI_IMAGE_MAX_BYTES:-20971520}"
      ELECKOI_IMAGE_TIME_BUDGET_MS: "${ELECKOI_IMAGE_TIME_BUDGET_MS:-900000}"
      ELECKOI_IMAGE_CONCURRENCY: "${ELECKOI_IMAGE_CONCURRENCY:-4}"
      # inline 模式：单图内联上限（超过的保留外链，避免卡片数据暴涨）
      ELECKOI_IMAGE_INLINE_MAX_BYTES: "${ELECKOI_IMAGE_INLINE_MAX_BYTES:-262144}"
      # 是否允许搬运本机地址（默认否：卡里写死的 localhost 多半是作者的开发地址）
      ELECKOI_IMAGE_ALLOW_LOCAL: "${ELECKOI_IMAGE_ALLOW_LOCAL:-0}"
      # AGPL-3.0 §13：以网络提供服务时须向使用者提供对应源码。
      # 未配置时服务会打印警告，并在登录页省略该入口。
      ELECKOI_SOURCE_URL: "${ELECKOI_SOURCE_URL:-}"
      # HTTPS 部署时开启，使会话 Cookie 带 Secure
      ELECKOI_SECURE_COOKIES: "${ELECKOI_SECURE_COOKIES:-0}"
      # 反向代理后需开启，才能从 X-Forwarded-For 取到真实客户端 IP（限流用）
      ELECKOI_TRUST_PROXY: "${ELECKOI_TRUST_PROXY:-0}"
    volumes:
      - eleckoi-data:/data
      # local 图片模式默认就放在这个数据卷里（/data/card-images），零额外配置。
      # 想放到别的大盘上，自己加一条挂载并保证属主是 10001:10001，例如：
      #   - /vol1/1000/eleckoi-card-images:/data/card-images
    # 容器加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 2g
          pids: 512

  # ── 可选：图床（Zipline）────────────────────────────────────────────
  # 为什么自带一个：角色卡常引用外部图床的立绘，那些图随时失效；卡片帧的 CSP
  # 又只放行白名单里的源。自己跑一个图床，「卡片能显示」与「导出后不失效」就都成立。
  #
  # 不启用不占任何资源：这两个服务在 `images` profile 下，默认的
  # `docker compose up -d` 完全忽略它们。启用见 docs/webui/卡片外链图片本地化.md。
  zipline-db:
    image: postgres:16-alpine
    container_name: zipline-db
    restart: unless-stopped
    profiles: [images]
    environment:
      POSTGRES_USER: zipline
      POSTGRES_DB: zipline
      POSTGRES_PASSWORD: "${ZIPLINE_DB_PASSWORD:-}"
    volumes:
      # 数据落在宿主机目录（ZIPLINE_DATA_DIR），不用命名卷：图床会长大，
      # 放在你自己的大盘上更好管，也便于单独备份。
      - ${ZIPLINE_DATA_DIR:-/var/lib/eleckoi-zipline}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zipline -d zipline']
      interval: 10s
      timeout: 5s
      retries: 5

  zipline:
    image: ghcr.io/diced/zipline:latest
    container_name: zipline
    restart: unless-stopped
    profiles: [images]
    depends_on:
      zipline-db:
        condition: service_healthy
    # 用 environment 逐项传入而不是 env_file：这样只有下面这几个变量会进图床容器，
    # ELECKOI_MASTER_KEY 之类的凭据不会被第三方镜像看到。
    # 配置项都写在 docker/.env（见 .env.example 的「自带图床」段）。
    environment:
      DATABASE_URL: "postgres://zipline:${ZIPLINE_DB_PASSWORD:-}@zipline-db:5432/zipline"
      CORE_HOSTNAME: 0.0.0.0
      CORE_PORT: "3000"
      # 会话与令牌签名密钥。换掉会让所有人登出、API 令牌全部失效。
      CORE_SECRET: "${ZIPLINE_CORE_SECRET:-}"
      WEBSITE_TITLE: "${ZIPLINE_TITLE:-ElecKoi 图床}"
      # ⚠️ 这两个开关别配反：REGISTRATION=false + INVITES=true 才是「邀请码才能注册」。
      # 注册时不带邀请码只看 REGISTRATION，为 true 就等于任何人都能注册。
      FEATURES_USER_REGISTRATION: "${ZIPLINE_USER_REGISTRATION:-false}"
      INVITES_ENABLED: "${ZIPLINE_INVITES_ENABLED:-true}"
      FILES_MAX_FILE_SIZE: "${ZIPLINE_MAX_FILE_SIZE:-20mb}"
      FILES_MAX_FILES_PER_UPLOAD: "${ZIPLINE_MAX_FILES_PER_UPLOAD:-10}"
      # 经 Lucky 反代：取真实客户端 IP、生成的链接用 https
      CORE_TRUST_PROXY: "true"
      CORE_RETURN_HTTPS_URLS: "true"
      CORE_DEFAULT_DOMAIN: "${ZIPLINE_DEFAULT_DOMAIN:-img.kidamita.top}"
      FEATURES_THUMBNAILS_ENABLED: "true"
    ports:
      - "${ELECKOI_IMAGES_BIND:-${ELECKOI_BIND:-127.0.0.1}}:${ELECKOI_IMAGES_PORT_HOST:-8792}:3000"
    volumes:
      # 图与缩略图；目录不存在时 Docker 会自动建（属主 root，正好是容器运行身份）
      - ${ZIPLINE_DATA_DIR:-/var/lib/eleckoi-zipline}/uploads:/zipline/uploads
      - ${ZIPLINE_DATA_DIR:-/var/lib/eleckoi-zipline}/public:/zipline/public
      - ${ZIPLINE_DATA_DIR:-/var/lib/eleckoi-zipline}/themes:/zipline/themes
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 512

volumes:
  eleckoi-data:
