name: ElecKoi Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows update
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify tag matches package version
        run: |
          $tagVersion = '${{ inputs.tag }}'.TrimStart('v')
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag ${{ inputs.tag }} does not match package.json version $packageVersion"
          }

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify all Electron processes
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm rebuild:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm check:electron-sqlite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm check:electron-dsh

      - name: Package Windows installer and update metadata
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Verify packaged DSH runtime
        run: pnpm verify:packaged-dsh

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $assets = @(
            (Get-ChildItem release -File -Filter '*-setup.exe').FullName
            (Get-ChildItem release -File -Filter '*-setup.exe.blockmap').FullName
            (Resolve-Path release/latest.yml).Path
          )
          $notes = @"
          1. 新增消息内富交互内容的音频、对话操作与资源加载支持。
          2. 优化 DSH 多会话运行、会话恢复与异常重启。
          3. 完善 Top P、推理强度及不同模型接口的能力适配。
          4. 完善角色卡、Agent 预设和设定库的导入导出。
          5. 修复数据库升级、消息状态、变量与本地媒体保存问题。
          6. 优化侧边栏折叠、模型配置和变量编辑体验。
          "@
          gh release create $env:RELEASE_TAG @assets --verify-tag --notes $notes --title "ElecKoi $env:RELEASE_TAG"
