name: ElecKoi Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.3
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows update
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify tag matches package version
        run: |
          $tagVersion = '${{ inputs.tag }}'.TrimStart('v')
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag ${{ inputs.tag }} does not match package.json version $packageVersion"
          }

      - name: Verify tagged commit passed Desktop CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = git rev-parse HEAD
          $response = gh api "repos/${{ github.repository }}/actions/workflows/desktop-ci.yml/runs?head_sha=$sha&event=push&per_page=10" | ConvertFrom-Json
          $run = $response.workflow_runs |
            Where-Object { $_.head_sha -eq $sha } |
            Sort-Object run_number -Descending |
            Select-Object -First 1
          if (-not $run -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') {
            throw "Desktop CI has not passed for tagged commit $sha"
          }

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify all Electron processes
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm rebuild:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm check:electron-sqlite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm check:electron-dsh

      - name: Package Windows installer and update metadata
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Verify packaged DSH runtime
        run: pnpm verify:packaged-dsh

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $assets = @(
            (Get-ChildItem release -File -Filter '*-setup.exe').FullName
            (Get-ChildItem release -File -Filter '*-setup.exe.blockmap').FullName
            (Resolve-Path release/latest.yml).Path
          )
          $notes = @"
          1. 修复客户端重启后轨迹无法读取、重新生成后旧轨迹残留及上下文重复显示的问题。
          2. 完善 Agent 预设与设定库的插入位置、缓存设定编辑和创建图标。
          3. 适配 Gemini 模型发现与真实模型能力。
          4. 完整支持数据库从 v1 连续迁移到 v3，并保留有效预设、设定和对话数据。
          5. 缩减 Windows 安装包中的非运行时依赖，并强化发布产物校验。
          "@
          gh release create $env:RELEASE_TAG @assets --verify-tag --notes $notes --title "ElecKoi $env:RELEASE_TAG"
