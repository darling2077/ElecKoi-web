name: ElecKoi Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.4
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows update
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify tag matches package version
        run: |
          $tagVersion = '${{ inputs.tag }}'.TrimStart('v')
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag ${{ inputs.tag }} does not match package.json version $packageVersion"
          }

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify all Electron processes
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm rebuild:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm check:electron-sqlite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm check:electron-dsh

      - name: Package Windows installer and update metadata
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Verify packaged DSH runtime
        run: pnpm verify:packaged-dsh

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $assets = @(
            (Get-ChildItem release -File -Filter '*-setup.exe').FullName
            (Get-ChildItem release -File -Filter '*-setup.exe.blockmap').FullName
            (Resolve-Path release/latest.yml).Path
          )
          $notes = @"
          1. 增加 Google Generative AI 原生协议支持，修复 Gemini 配置阻断其他模型聊天的问题。
          2. 修复正常发送与重新生成的会话判断、模型绑定和旧运行轨迹清理问题。
          3. 将开发版与安装版的数据目录分离，避免两个版本共用数据库。
          4. 完善 Gemini 工具调用测试，保留模型返回的调用标识与思考签名，并兼容不支持强制工具调用的模型。
          5. 对齐 Agent 预设与角色设定库的创建菜单、插入位置节点和缓存设定交互。
          "@
          gh release create $env:RELEASE_TAG @assets --verify-tag --notes $notes --title "ElecKoi $env:RELEASE_TAG"
