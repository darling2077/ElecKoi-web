# ElecKoi overlay for the official DSH sdk profile.
# The shipped dsh-base and dsh-sdk-app bundles own the runtime graph; this file
# only supplies product configuration and ElecKoi's session bridges.

- id: system-prompt
  config:
    personaPrefix: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are ElecKoi.'
    personaSuffix: ''

- id: attachment-local
  config:
    dshHome: !!js process.env.DSH_HOME
    maxImageBytes: 20971520
    maxImagesPerMessage: 4
    maxMessageImageBytes: 20971520

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  config:
    policy: never

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      eleckoi-workspace:
        sandbox: workspace-write
        approval: never
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: eleckoi-workspace

- id: web
  config:
    searchProvider: !!js process.env.DSH_WEB_SEARCH_PROVIDER ?? 'deepseek-official'
    fetchProvider: http

- id: web-search-deepseek
  config:
    apiKeyEnv: ELECKOI_NATIVE_WEB_SEARCH_API_KEY

- id: web-fetch-http
  config:
    maxUrlLength: 2048
    maxResponseBytes: 5000000
    maxBodyChars: 100000
    timeoutMs: 35000
    maxRedirects: 5

- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: true

# The SDK base profile keeps model-facing rows for a process-wide agent. ElecKoi
# composes them per Session through Agent Presets, matching DSH's own multi-
# session profile: host registries stay loaded while global tool rows are
# disabled so preset-scoped configuration and policy remain authoritative.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: !!js process.env.ELECKOI_AGENT_PRESET ?? 'agent-preset-standard'
        includeShippedRoot: false
        includeUserRoot: true

    - id: agent-preset-bridge
      name: './agent-preset-bridge.mjs'

    - id: web-search-tavily
      name: './tavily-web-search.mjs'
